name: Deploy to Server (SFTP)

# Auto-Deploy fuer bulkify-4.1.
# - Push auf main: alle Dateien, die sich seit dem ZULETZT DEPLOYTEN Stand geaendert haben, werden per SFTP
#   hochgeladen (inkrementell). Der deployte Stand steht auf dem Server in .deploy_sha (ausserhalb von public/).
# - Vollupload-Fallback: keine/ungueltige .deploy_sha, manueller Start, oder paramiko nicht installierbar -
#   aber NUR fuer den aktuellen main HEAD (12.11.2026).
# - Schutz gegen Zurueckdrehen (12.11.2026, haengende Laeufe #1813-#1815 nach der GitHub-Stoerung): ist der
#   Server schon auf diesem oder einem neueren Stand, setzt prep mode=skip -> kein Upload, kein mark, Lauf gruen.
#   mark schreibt nie einen aelteren Stand in .deploy_sha (liest direkt vorher erneut).
# - Upload-Werkzeug seit 11.11.2026: Python/paramiko (.github/scripts/sftp_deploy.py) statt apt/lftp.
# - Passwort seit 13.11.2026 aus secrets.DEPLOY_PASSWORD (nicht mehr SERVER_PASSWORD): alte Workflow-Fassungen (haengende
#   Laeufe #1813-#1815, "Re-run" alter Laeufe) lesen SERVER_PASSWORD und scheitern an der Anmeldung, sobald es geloescht ist.
# WARUM .deploy_sha (2026-11-03): GitHub haelt je Concurrency-Gruppe nur EINEN wartenden Lauf; bei schnell
# aufeinanderfolgenden Pushes werden Zwischenlaeufe verworfen. Frueher lud jeder Lauf nur die Dateien SEINES
# Commits (event.before..sha) hoch -> Dateien aus verworfenen Laeufen kamen nie auf den Server. Jetzt rechnet
# jeder Lauf ab dem tatsaechlich deployten Stand und holt verpasste Commits automatisch nach.
# Sicherheit: es wird NICHTS auf dem Server geloescht. Ausgeschlossen: secrets.php (Live-DB-Zugang),
# der GESAMTE data/-Ordner (Uploads/Logs), Git-/CI-Interna, *.sql/*.bak/*.log.
# WICHTIG: SERVER_PATH muss ein EIGENER Ordner sein (nicht die v3-Live-Seite). core/config.php laedt
# auf dem Server secrets.php (dort die echten DB-Zugangsdaten hinterlegen).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nur EIN Deploy gleichzeitig: mehrere parallele SFTP-Sessions zum selben Server blockieren sich sonst.
# cancel-in-progress: false = laufenden Upload NIE abbrechen (sonst Teil-Upload). Verworfene wartende Laeufe
# sind unkritisch, weil der naechste Lauf ab .deploy_sha alles nachholt.
concurrency:
  group: deploy-sftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 40 min: der Vollupload (erster Lauf ohne .deploy_sha / manueller Start) braucht deutlich mehr als 10 min.
    # Haengt ein SFTP-Schritt doch, bricht der Lauf danach ab und die Queue laeuft weiter.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Seit 11.11.2026: KEIN apt/lftp mehr. Der Runner konnte security.ubuntu.com nicht aufloesen,
      # "apt-get install lftp" hing ~10 min und brach mit exit 100 ab -> jeder Deploy fiel aus.
      # Jetzt: Python aus dem Runner-Toolcache + paramiko von PyPI, harte Zeitgrenze statt Haengen.
      - name: Python + paramiko bereitstellen (ohne apt)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Sicherheitsnetz: klappt auch PyPI nicht, laeuft der Vollupload (Node-Action, ohne apt/pip).
      - name: paramiko installieren
        id: pyp
        continue-on-error: true
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 20 paramiko

      # Fuer den Notfall-Vollupload ohne paramiko: ist dieser Lauf der aktuelle main HEAD? (sonst nie Vollupload)
      - name: main HEAD pruefen
        id: head
        timeout-minutes: 2
        run: |
          HEAD_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          [ -z "$HEAD_SHA" ] && HEAD_SHA="$(git rev-parse -q --verify refs/remotes/origin/main || true)"
          echo "main HEAD: ${HEAD_SHA:-unbekannt} - dieser Lauf: $GITHUB_SHA"
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ]; then echo "ishead=1" >> "$GITHUB_OUTPUT"; else echo "ishead=0" >> "$GITHUB_OUTPUT"; fi

      - name: Aenderungsumfang bestimmen (ab deploytem Stand oder Vollupload)
        id: prep
        if: steps.pyp.outcome == 'success'
        timeout-minutes: 3
        env:
          EVENT_NAME: ${{ github.event_name }}
          AFTER_SHA: ${{ github.sha }}
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          SFTP_PATH: ${{ secrets.SERVER_PATH }}
        run: python .github/scripts/sftp_deploy.py prep

      - name: Inkrementeller Upload (nur geaenderte Dateien, SFTP/paramiko)
        if: steps.prep.outputs.mode == 'incremental'
        timeout-minutes: 20
        env:
          EVENT_NAME: ${{ github.event_name }}
          AFTER_SHA: ${{ github.sha }}
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          SFTP_PATH: ${{ secrets.SERVER_PATH }}
        run: python .github/scripts/sftp_deploy.py upload

      - name: Vollupload (Fallback, nichts loeschen)
        if: steps.prep.outputs.mode == 'full' || (steps.pyp.outcome != 'success' && steps.head.outputs.ishead == '1')
        uses: sand4rt/ftp-deployer@v1.10
        with:
          sftp: true
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          remote_folder: ${{ secrets.SERVER_PATH }}
          local_folder: '.'
          cleanup: false
          include: '["*", "**/*"]'
          exclude: '["secrets.php",".git/**",".github/**","data/**","**/*.sql","**/*.bak","**/*.log"]'

      - name: Deployten Stand merken (.deploy_sha)
        if: steps.pyp.outcome == 'success' && steps.prep.outputs.mode != 'skip'
        timeout-minutes: 3
        env:
          EVENT_NAME: ${{ github.event_name }}
          AFTER_SHA: ${{ github.sha }}
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          SFTP_PATH: ${{ secrets.SERVER_PATH }}
        run: python .github/scripts/sftp_deploy.py mark
