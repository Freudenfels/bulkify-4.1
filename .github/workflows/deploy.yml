name: Deploy to Server (SFTP)

# Auto-Deploy fuer bulkify-4.1.
# - Push auf main: alle Dateien, die sich seit dem ZULETZT DEPLOYTEN Stand geaendert haben, werden per SFTP
#   hochgeladen (inkrementell). Der deployte Stand steht auf dem Server in .deploy_sha (ausserhalb von public/).
# - Vollupload-Fallback: keine/ungueltige .deploy_sha, manueller Start.
# WARUM .deploy_sha (2026-11-03): GitHub haelt je Concurrency-Gruppe nur EINEN wartenden Lauf; bei schnell
# aufeinanderfolgenden Pushes werden Zwischenlaeufe verworfen. Frueher lud jeder Lauf nur die Dateien SEINES
# Commits (event.before..sha) hoch -> Dateien aus verworfenen Laeufen kamen nie auf den Server. Jetzt rechnet
# jeder Lauf ab dem tatsaechlich deployten Stand und holt verpasste Commits automatisch nach.
# Sicherheit: es wird NICHTS auf dem Server geloescht. Ausgeschlossen: secrets.php (Live-DB-Zugang),
# der GESAMTE data/-Ordner (Uploads/Logs), Git-/CI-Interna, *.sql/*.bak/*.log.
# WICHTIG: SERVER_PATH muss ein EIGENER Ordner sein (nicht die v3-Live-Seite). core/config.php laedt
# auf dem Server secrets.php (dort die echten DB-Zugangsdaten hinterlegen).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Nur EIN Deploy gleichzeitig: mehrere parallele SFTP-Sessions zum selben Server blockieren sich sonst.
# cancel-in-progress: false = laufenden Upload NIE abbrechen (sonst Teil-Upload). Verworfene wartende Laeufe
# sind unkritisch, weil der naechste Lauf ab .deploy_sha alles nachholt.
concurrency:
  group: deploy-sftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04   # fest (11.11.2026): ubuntu-latest = Ubuntu 26, dort scheiterte apt (DNS security.ubuntu.com) -> lftp fehlte
    # 40 min: der Vollupload (erster Lauf ohne .deploy_sha / manueller Start) braucht deutlich mehr als 10 min.
    # Haengt ein SFTP-Schritt doch, bricht der Lauf danach ab und die Queue laeuft weiter.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: lftp installieren
        run: |
          # Fremd-Paketquellen auf dem Runner (z. B. google-chrome) koennen "apt-get update"
          # mit "Hash Sum mismatch" (exit 100) sprengen. Wir brauchen nur lftp aus den Ubuntu-
          # Basisquellen (ubuntu.sources), daher die *.list-Fremdquellen vorher entfernen.
          sudo rm -f /etc/apt/sources.list.d/*.list || true
          sudo apt-get update -qq || sudo apt-get update -qq --allow-releaseinfo-change || true
          sudo apt-get install -y -qq lftp

      - name: Aenderungsumfang bestimmen (ab deploytem Stand oder Vollupload)
        id: prep
        env:
          EVENT_NAME: ${{ github.event_name }}
          AFTER_SHA: ${{ github.sha }}
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.SERVER_PASSWORD }}
          SFTP_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          REMOTE="${SFTP_PATH%/}"
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
          # Zuletzt deployten Stand vom Server lesen (fehlt die Datei: leer -> Vollupload).
          BASE_SHA=$( {
            printf 'set sftp:auto-confirm yes\nset net:timeout 20\nset net:max-retries 2\n'
            printf 'open sftp://%s:%s\n' "$SFTP_HOST" "$SFTP_PORT"
            printf 'user "%s" "%s"\n' "$(esc "$SFTP_USER")" "$(esc "$SFTP_PASS")"
            printf 'cat "%s/.deploy_sha"\nbye\n' "$(esc "$REMOTE")"
          } | lftp 2>/dev/null | tr -cd '0-9a-f' | head -c 40 || true )
          echo "Deployter Stand auf dem Server: ${BASE_SHA:-<keiner>}"
          MODE=incremental
          if [ "$EVENT_NAME" != "push" ]; then MODE=full; fi
          if [ "${#BASE_SHA}" -ne 40 ]; then MODE=full; fi
          if [ "$MODE" = "incremental" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then MODE=full; fi
          if [ "$MODE" = "incremental" ] && ! git merge-base --is-ancestor "$BASE_SHA" "$AFTER_SHA"; then MODE=full; fi
          if [ "$MODE" = "incremental" ]; then
            if ! git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$AFTER_SHA" > changed_all.txt; then
              MODE=full
            fi
          fi
          if [ "$MODE" = "incremental" ]; then
            grep -vE '^secrets\.php$|^\.git(hub)?/|^data/|\.sql$|\.bak$|\.log$' changed_all.txt > changed_filtered.txt || true
            COUNT=$(grep -c . changed_filtered.txt || true)
            echo "Modus: inkrementell ab ${BASE_SHA}. Zu uebertragende Dateien: ${COUNT:-0}"
            echo "----- Dateiliste -----"; cat changed_filtered.txt || true; echo "----------------------"
          else
            echo "Modus: Vollupload (Fallback)."
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Inkrementeller Upload (nur geaenderte Dateien, lftp/SFTP)
        if: steps.prep.outputs.mode == 'incremental'
        env:
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.SERVER_PASSWORD }}
          SFTP_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          if [ ! -s changed_filtered.txt ]; then
            echo "Keine relevanten Aenderungen - nichts hochzuladen."
            exit 0
          fi
          REMOTE="${SFTP_PATH%/}"
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
          : > lftp_puts.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ ! -f "$f" ]; then echo "uebersprungen (lokal nicht vorhanden): $f"; continue; fi
            d=$(dirname "$f")
            if [ "$d" = "." ]; then TARGET="$REMOTE"; else TARGET="$REMOTE/$d"; fi
            printf 'mkdir -pf "%s"\n' "$(esc "$TARGET")" >> lftp_puts.txt
            printf 'put -O "%s" "%s"\n' "$(esc "$TARGET")" "$(esc "$f")" >> lftp_puts.txt
          done < changed_filtered.txt
          if [ ! -s lftp_puts.txt ]; then
            echo "Keine tatsaechlich vorhandenen Dateien zu uebertragen."
            exit 0
          fi
          {
            printf 'set sftp:auto-confirm yes\n'
            printf 'set net:timeout 20\n'
            printf 'set net:max-retries 2\n'
            printf 'set cmd:fail-exit yes\n'
            printf 'open sftp://%s:%s\n' "$SFTP_HOST" "$SFTP_PORT"
            printf 'user "%s" "%s"\n' "$(esc "$SFTP_USER")" "$(esc "$SFTP_PASS")"
            cat lftp_puts.txt
            printf 'bye\n'
          } | lftp
          echo "Inkrementeller Upload abgeschlossen."

      - name: Vollupload (Fallback, nichts loeschen)
        if: steps.prep.outputs.mode == 'full'
        uses: sand4rt/ftp-deployer@v1.10
        with:
          sftp: true
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          remote_folder: ${{ secrets.SERVER_PATH }}
          local_folder: '.'
          cleanup: false
          include: '["*", "**/*"]'
          exclude: '["secrets.php",".git/**",".github/**","data/**","**/*.sql","**/*.bak","**/*.log"]'

      - name: Deployten Stand merken (.deploy_sha)
        env:
          AFTER_SHA: ${{ github.sha }}
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.SERVER_PASSWORD }}
          SFTP_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          set -euo pipefail
          REMOTE="${SFTP_PATH%/}"
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'; }
          printf '%s\n' "$AFTER_SHA" > .deploy_sha
          {
            printf 'set sftp:auto-confirm yes\nset net:timeout 20\nset net:max-retries 2\nset cmd:fail-exit yes\n'
            printf 'open sftp://%s:%s\n' "$SFTP_HOST" "$SFTP_PORT"
            printf 'user "%s" "%s"\n' "$(esc "$SFTP_USER")" "$(esc "$SFTP_PASS")"
            printf 'put -O "%s" .deploy_sha\nbye\n' "$(esc "$REMOTE")"
          } | lftp
          echo "Deployter Stand: $AFTER_SHA"
