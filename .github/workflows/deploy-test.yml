name: Deploy Testumgebung (test.bulkify.pro)

# Paket 12.11.2026 Teil 2: Code-Stand main zusaetzlich in die Testumgebung hochladen.
# Bewusst ein EIGENER Workflow (nicht ein zweiter Job in deploy.yml):
#  - eigene Concurrency-Gruppe -> ein haengender Test-Upload haelt den naechsten Live-Deploy nie auf
#  - startet erst NACH dem Live-Deploy (workflow_run) -> keine zwei SFTP-Sitzungen gleichzeitig im Normalfall
#  - schlaegt er fehl, bleibt der Live-Lauf gruen (eigener Lauf, eigenes Ergebnis)
# Ziel: Secret TEST_SERVER_PATH (eigener Ordner, NICHT der Live-Ordner und NICHT beta). Fehlt es, passiert nichts.
# Zugang: dieselben SERVER_HOST/PORT/USERNAME wie live (gleiches Hosting), Passwort aus DEPLOY_PASSWORD (13.11.2026).
# 13.11.2026: nur nach gruenem Live-Lauf; Zielpfad per realpath gegen live/beta (Secret BETA_SERVER_PATH, optional) geprueft;
# legt den Datei-Marker .testumgebung an (Testmodus auch auf der Kommandozeile, Sub-Apps nur mit eigener secrets.php).
# Alte Laeufe (12.11.2026): ist die Testumgebung schon neuer, setzt prep mode=skip -> kein Upload, kein mark.
# Auf dem Server legt Nico einmalig <TEST_SERVER_PATH>/secrets.php an (Test-DB, BX_TESTUMGEBUNG) - wird nie hochgeladen.
on:
  workflow_run:
    workflows: ["Deploy to Server (SFTP)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  # 13.11.2026 (Fable-3 T4.5/D9): ein laufender Test-Upload wird nicht mehr abgebrochen (sonst bliebe test halb hochgeladen).
  cancel-in-progress: false

jobs:
  deploy-test:
    # 13.11.2026: nur nach einem GRÜNEN Live-Lauf (oder von Hand) – ein fehlgeschlagener/abgebrochener Live-Lauf startet keinen Test-Upload.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_PATH: ${{ secrets.TEST_SERVER_PATH }}
      LIVE_PATH: ${{ secrets.SERVER_PATH }}
    steps:
      - name: Ziel pruefen
        id: ziel
        run: |
          if [ -z "$TEST_PATH" ]; then echo "TEST_SERVER_PATH nicht gesetzt - Testumgebung wird uebersprungen."; echo "los=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${TEST_PATH%/}" = "${LIVE_PATH%/}" ]; then echo "TEST_SERVER_PATH ist gleich SERVER_PATH - Abbruch, live wird nie ueberschrieben."; exit 1; fi
          echo "los=1" >> "$GITHUB_OUTPUT"

      - name: Checkout (Stand des Live-Deploys bzw. main)
        if: steps.ziel.outputs.los == '1'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 13.11.2026 (Fable-3 T4.5/D2): das Deploy-Skript immer aus main nehmen (nicht aus dem ausgecheckten, evtl. alten Commit) –
      # so gelten Schutz und Pfadprüfung von main auch für ältere Stände.
      - name: Deploy-Skript aus main holen
        if: steps.ziel.outputs.los == '1'
        run: |
          git show origin/main:.github/scripts/sftp_deploy.py > "$RUNNER_TEMP/sftp_deploy.py"
          echo "DEPLOY_PY=$RUNNER_TEMP/sftp_deploy.py" >> "$GITHUB_ENV"

      - name: Python + paramiko
        if: steps.ziel.outputs.los == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: paramiko installieren
        if: steps.ziel.outputs.los == '1'
        timeout-minutes: 4
        run: python -m pip install --disable-pip-version-check --retries 5 --timeout 20 paramiko

      # 13.11.2026: Zielpfad auf dem Server mit realpath pruefen – gleich, Unter- oder Elternordner von live bzw. beta = Abbruch.
      - name: Zielpfad pruefen (realpath gegen live und beta)
        if: steps.ziel.outputs.los == '1'
        timeout-minutes: 3
        env:
          TEST_PATH: ${{ secrets.TEST_SERVER_PATH }}
          LIVE_PATH: ${{ secrets.SERVER_PATH }}
          BETA_PATH: ${{ secrets.BETA_SERVER_PATH }}
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          SFTP_PATH: ${{ secrets.TEST_SERVER_PATH }}
        run: python "$DEPLOY_PY" pfadcheck

      - name: Aenderungsumfang bestimmen
        id: prep
        if: steps.ziel.outputs.los == '1'
        timeout-minutes: 3
        env:
          EVENT_NAME: push
          AFTER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          SFTP_PATH: ${{ secrets.TEST_SERVER_PATH }}
        run: python "$DEPLOY_PY" prep

      - name: Upload (inkrementell, beim ersten Mal alles)
        if: steps.ziel.outputs.los == '1' && steps.prep.outputs.mode != 'skip'
        timeout-minutes: 20
        env:
          EVENT_NAME: push
          AFTER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          SFTP_PATH: ${{ secrets.TEST_SERVER_PATH }}
          MODE: ${{ steps.prep.outputs.mode }}
        run: |
          if [ "$MODE" = "full" ]; then python "$DEPLOY_PY" upload_all; else python "$DEPLOY_PY" upload; fi

      - name: robots.txt nur fuer test (Suchmaschinen aussperren)
        if: steps.ziel.outputs.los == '1' && steps.prep.outputs.mode != 'skip'
        timeout-minutes: 3
        env:
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          SFTP_PATH: ${{ secrets.TEST_SERVER_PATH }}
        run: |
          printf 'User-agent: *\nDisallow: /\n' > robots_test.txt
          python "$DEPLOY_PY" put robots_test.txt public/robots.txt
          # 13.11.2026: Datei-Marker der Testumgebung (Testmodus auch auf der Kommandozeile, nur eigene secrets.php)
          printf 'test\n' > testumgebung_marker.txt
          python "$DEPLOY_PY" put testumgebung_marker.txt .testumgebung

      - name: Deployten Stand merken (.deploy_sha der Testumgebung)
        if: steps.ziel.outputs.los == '1' && steps.prep.outputs.mode != 'skip'
        timeout-minutes: 3
        env:
          EVENT_NAME: push
          AFTER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SFTP_HOST: ${{ secrets.SERVER_HOST }}
          SFTP_PORT: ${{ secrets.SERVER_PORT }}
          SFTP_USER: ${{ secrets.SERVER_USERNAME }}
          SFTP_PASS: ${{ secrets.DEPLOY_PASSWORD }}
          SFTP_PATH: ${{ secrets.TEST_SERVER_PATH }}
        run: python "$DEPLOY_PY" mark
