; Upload-Limits fuer bulkify (Kundenportal: Etikett-Design, Vertrags-PDFs, Wareneingang-Belege).
; Druckfertige Etiketten/PDFs sind oft groesser als die PHP-Defaults (meist 2M/8M).
; Wirkt auf PHP als FPM/CGI (.user.ini); bei mod_php ggf. ignoriert.
upload_max_filesize = 32M
post_max_size = 40M
max_file_uploads = 30
